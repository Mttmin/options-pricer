[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
futures = "0.3"
ggca = "1.0.0"
options = { path = "../options" }
reqwest = { version = "0.13.1", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
statrs = "0.18"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
